Repository = "https://github.com/X4Lch3mist/ComfyUI-X4Lch3mist"
"Bug Tracker" = "https://github.com/X4Lch3mist/ComfyUI-X4Lch3mist/issues"

[tool.comfy]
PublisherId = "x4lch3mist"
DisplayName = "X4Lch3mist Nodes"
